name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion derives the version from the commit history and fails outright on the
          # shallow clone actions/checkout makes by default. Every job here needs this.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Running the tests on Linux is not redundant with a developer's Windows run: the path
      # defaults are per-OS, so the assertions covering /var/lib/hostpinger are skipped on Windows
      # and only ever execute here.
      - run: dotnet test HostPinger.Test/HostPinger.Test.csproj -c Release

      # The runner image ships Chrome, which is what these drive; on a machine without one they
      # report that and are ignored rather than failing, so this stays green either way.
      - run: dotnet test HostPinger.UITest/HostPinger.UITest.csproj -c Release

  rpm:
    name: rpm (fedora)
    runs-on: ubuntu-latest
    # GitVersion takes the branch from GITHUB_REF when it detects Actions. On a tag push that is
    # refs/tags/v1.2.0, which is not a branch, so it gives up on finding one and computes the next
    # patch off the highest tag in the repository rather than honouring the tag being built —
    # v1.2.0 produced 1.2.1-no-branch.1, and it drifts further as more tags land. Every tag here
    # is an ancestor of main, so naming main is accurate rather than a convenient fiction, and it
    # is what the same commit would have built as when it was pushed to the branch.
    env:
      GITHUB_REF: ${{ github.ref_type == 'tag' && 'refs/heads/main' || github.ref }}
    # Built inside the distribution it targets, against the .NET SDK that distribution packages.
    # That is the point of this job rather than a convenience: Fedora ships the 10.0.1xx feature
    # band while a developer machine typically has 10.0.3xx, and the two disagree about source
    # they will accept — a Razor component that compiles on one has already failed on the other.
    # Building on ubuntu-latest with actions/setup-dotnet would not catch that class of break.
    container: fedora:44
    steps:
      # Before the checkout: without git in the container, actions/checkout falls back to
      # downloading a tarball, which arrives with no .git directory and leaves GitVersion unable
      # to compute a version.
      #
      # systemd-rpm-macros supplies %{_unitdir} and the %systemd_* scriptlet macros. It usually
      # arrives as a dependency of rpm-build, but an undefined %{_unitdir} fails in a way that
      # takes a while to recognise, so it is named explicitly.
      #
      # selinux-policy-devel is what builds the policy module, and it brings make, m4 and
      # checkpolicy with it. systemd is not used by anything in the build: it satisfies the
      # pkgconfig(systemd) build dependency that %selinux_requires_min declares, and rpmbuild
      # refuses to start until every BuildRequires is installed. The pkgconfig file lives in the
      # systemd package rather than systemd-devel, which is not what the name suggests.
      - name: Install build dependencies
        run: |
          dnf install -y git tar findutils bzip2 dotnet-sdk-10.0 rpm-build systemd-rpm-macros \
                         selinux-policy-devel systemd

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The checkout is owned by a different uid than the one running the build, which git refuses
      # to operate on until told the directory is trusted.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the RPM
        run: bash HostPinger.LinuxInstaller/build-rpm.sh

      # Guards two properties of the spec that are invisible in the built artefact and easy to
      # regress: the runtime dependency the package needs to be installable at all, and the
      # filter that stops a private bundled library being advertised to the whole distribution.
      - name: Verify package metadata
        run: |
          set -euo pipefail
          rpm_file=$(ls HostPinger.LinuxInstaller/build/rpmbuild/RPMS/x86_64/*.rpm | head -1)
          echo "checking $rpm_file"

          # A tag says what version it is, so nothing downstream should have to derive it. This is
          # the check that would have caught GitVersion answering with the branch it could not find
          # instead of the tag it was standing on, and it is cheap to keep.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            expected=${GITHUB_REF_NAME#v}
            actual=$(rpm -qp --queryformat '%{VERSION}' "$rpm_file")
            if [ "$actual" != "$expected" ]; then
              echo "::error::building $GITHUB_REF_NAME produced version $actual, expected $expected"
              exit 1
            fi
          fi

          if ! rpm -qp --requires "$rpm_file" | grep -qx 'aspnetcore-runtime-10.0'; then
            echo "::error::the package no longer requires aspnetcore-runtime-10.0"
            exit 1
          fi

          if rpm -qp --provides "$rpm_file" | grep -q 'libe_sqlite3'; then
            echo "::error::the bundled SQLite library is leaking into Provides"
            exit 1
          fi

          rpm -qpi "$rpm_file"

          # The policy module is what lets the service run at all on an enforcing machine, and it
          # fails quietly in both directions: a subpackage that stopped being built takes nothing
          # with it, and a file context naming a path the application is no longer installed to
          # still compiles, still loads, and simply labels nothing. Both are checked here because
          # neither shows up as a failure anywhere else.
          selinux_rpm=$(ls HostPinger.LinuxInstaller/build/rpmbuild/RPMS/noarch/*-selinux-*.rpm | head -1)
          echo "checking $selinux_rpm"

          module=/usr/share/selinux/packages/targeted/hostpinger.pp.bz2
          if ! rpm -qpl "$selinux_rpm" | grep -qx "$module"; then
            echo "::error::the selinux subpackage no longer ships $module"
            exit 1
          fi

          rpm2cpio "$selinux_rpm" | cpio -i --to-stdout ".$module" 2>/dev/null | bunzip2 > module.pp
          if ! grep -qa '/usr/lib/hostpinger/HostPinger' module.pp; then
            echo "::error::the policy module carries no file context for the installed launcher"
            exit 1
          fi

      # Every architecture directory, not just x86_64: the policy module is noarch and builds into
      # its own, and an artifact that misses it is a release that ships the application without
      # the thing that lets it run.
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: HostPinger.LinuxInstaller/build/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

  deb:
    name: deb (debian)
    runs-on: ubuntu-latest
    # See the rpm job: on a tag push GITHUB_REF names something GitVersion cannot find a branch
    # for, and it answers with the next patch off the highest tag rather than the tag being built.
    env:
      GITHUB_REF: ${{ github.ref_type == 'tag' && 'refs/heads/main' || github.ref }}
    # Built inside the distribution it targets, as the rpm job is, and against the SDK from the
    # same repository the installed package resolves its runtime from: Debian ships no .NET at
    # all, so both come from packages.microsoft.com. That makes this the only job that proves the
    # dependency users have to satisfy actually exists and is installable.
    container: debian:13
    steps:
      # Before the checkout, for the reason the rpm job gives: without git in the container,
      # actions/checkout downloads a tarball, which arrives with no .git directory and leaves
      # GitVersion unable to compute a version. curl and ca-certificates come first because the
      # repository package below is fetched over HTTPS, and until it is installed there is no
      # .NET SDK to be found under any name.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y curl ca-certificates git

          curl -fsSL -o /tmp/packages-microsoft-prod.deb \
            https://packages.microsoft.com/config/debian/13/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          rm -f /tmp/packages-microsoft-prod.deb

          apt-get update
          apt-get install -y dotnet-sdk-10.0 dpkg-dev debhelper build-essential

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The checkout is owned by a different uid than the one running the build, which git refuses
      # to operate on until told the directory is trusted.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the deb
        run: bash HostPinger.LinuxInstaller/build-deb.sh

      # The counterpart to the rpm job's check, guarding the same class of fault: properties that
      # are invisible in the built artefact and produce a package that installs and then does not
      # work. The two derived files are the addition — build-deb.sh rewrites the unit and the
      # environment file out of the RPM's copies, and a sed that stops matching would ship a
      # service reading a path Debian never installs.
      - name: Verify package metadata
        run: |
          set -euo pipefail
          deb_file=$(ls HostPinger.LinuxInstaller/build-deb/*.deb | head -1)
          echo "checking $deb_file"

          rm -rf unpacked control
          dpkg-deb -x "$deb_file" unpacked
          dpkg-deb -e "$deb_file" control

          # A tag says what version it is, so nothing downstream should have to derive it.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            expected=${GITHUB_REF_NAME#v}
            actual=$(dpkg-deb -f "$deb_file" Version)
            if [ "$actual" != "$expected" ]; then
              echo "::error::building $GITHUB_REF_NAME produced version $actual, expected $expected"
              exit 1
            fi
          fi

          if ! dpkg-deb -f "$deb_file" Depends | grep -q 'aspnetcore-runtime-10\.0'; then
            echo "::error::the package no longer depends on aspnetcore-runtime-10.0"
            exit 1
          fi

          # Only a self-contained publish brings the runtime's own assemblies along, and it would
          # satisfy every other check here while quietly shipping a runtime nobody patches.
          if [ -f unpacked/usr/lib/hostpinger/System.Private.CoreLib.dll ]; then
            echo "::error::the publish is self-contained; it carries its own copy of the runtime"
            exit 1
          fi

          unit=$(find unpacked -name hostpinger.service)
          if [ -z "$unit" ]; then
            echo "::error::the package ships no systemd unit"
            exit 1
          fi
          echo "unit: $unit"
          if ! grep -qx 'EnvironmentFile=-/etc/default/hostpinger' "$unit"; then
            echo "::error::the packaged unit does not read /etc/default/hostpinger"
            exit 1
          fi

          # Registered as a conffile or an upgrade silently overwrites a machine's edited port.
          if ! grep -qx '/etc/default/hostpinger' control/conffiles; then
            echo "::error::/etc/default/hostpinger is not a conffile; upgrades would overwrite it"
            exit 1
          fi

          if [ ! -x unpacked/usr/lib/hostpinger/HostPinger ]; then
            echo "::error::the launcher is missing or not executable"
            exit 1
          fi

          # dh_installsystemd writes these, and it does so from debian/hostpinger.service being
          # in the right place. If that ever stops being true the package still installs — it
          # just never enables or starts anything, on a distribution where it is expected to.
          if ! grep -q 'deb-systemd-helper' control/postinst; then
            echo "::error::postinst carries no systemd enablement"
            exit 1
          fi

          dpkg-deb -I "$deb_file"

      # Every check above reads the package; this one runs it, and it is the only thing here that
      # executes the maintainer scripts. Those are half generated and half hand-written, and the
      # ways they break are invisible to inspection — a debhelper marker mentioned in a comment
      # was substituted twice and left the prose around it to be run as a command, which every
      # metadata check passed straight over. Resolving the dependency is the other half: the
      # runtime this package names is Microsoft's, not Debian's, and nothing else here proves a
      # machine could actually satisfy it.
      #
      # It stops short of starting the service — the container has no systemd, which the generated
      # scriptlet checks for and skips. The unit is confirmed to have been enabled instead, which
      # deb-systemd-helper does by writing the symlink whether systemd is running or not.
      - name: Install the package
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y ./"$(ls HostPinger.LinuxInstaller/build-deb/*.deb | head -1)"

          getent passwd hostpinger
          test -x /usr/lib/hostpinger/HostPinger
          if [ ! -L /etc/systemd/system/multi-user.target.wants/hostpinger.service ]; then
            echo "::error::installing the package did not enable the service"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: HostPinger.LinuxInstaller/build-deb/*.deb
          if-no-files-found: error

  msi:
    name: msi (windows)
    runs-on: windows-latest
    # See the rpm job. The MSI hides the fault rather than showing it: ProductVersion has to be
    # numeric, so the no-branch label is dropped on the way in and a wrong version arrives looking
    # like a perfectly ordinary one.
    env:
      GITHUB_REF: ${{ github.ref_type == 'tag' && 'refs/heads/main' || github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The WiX project publishes the application itself before packaging it, so this one command
      # covers the whole Windows path.
      - name: Build the MSI
        run: dotnet build HostPinger.WindowsInstaller/HostPinger.WindowsInstaller.wixproj -c Release

      # The counterpart to the RPM job's metadata check. It guards the two halves of being
      # framework-dependent — the payload carries no runtime, and the installer refuses a machine
      # that has none, which a stray --self-contained would undo without failing the build — and
      # then the two halves of the UI being reachable at all, the bound port and the firewall rule.
      - name: Verify package metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Only a self-contained publish brings the runtime's own assemblies along.
          if (Test-Path 'HostPinger.WindowsInstaller/obj/publish/win-x64/System.Private.CoreLib.dll') {
            Write-Output '::error::the publish is self-contained; it carries its own copy of the runtime'
            exit 1
          }

          $msi = (Get-ChildItem HostPinger.WindowsInstaller/bin -Recurse -Filter *.msi)[0].FullName
          Write-Output "checking $msi"

          # The installer database has no command line tool on the runner; this is the COM API that
          # msiexec itself uses. Late-bound because the interfaces carry no usable type library.
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @('SELECT Condition FROM LaunchCondition'))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)

          $conditions = @()
          while ($record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)) {
            $conditions += [string]$record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, @(1))
          }
          $conditions | ForEach-Object { Write-Output "launch condition: $_" }

          if (-not ($conditions -match 'ASPNETCORERUNTIME')) {
            Write-Output '::error::the MSI no longer requires the ASP.NET Core runtime to be installed'
            exit 1
          }

          # Reaching the UI from another machine takes two rows in two different tables, and losing
          # either one produces the same silent result: a service that answers only itself, which
          # nothing about the install or the build would report. Adding the firewall rule is even
          # authored to fail quietly on the target machine, so a check here is what is left.
          function Get-Rows($query) {
            $v = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($query))
            # Discarded rather than left to fall out of the function, where it would join the rows.
            [void]$v.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $v, $null)
            $rows = @()
            while ($r = $v.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $v, $null)) {
              $count = $r.GetType().InvokeMember('FieldCount', 'GetProperty', $null, $r, $null)
              $fields = @()
              for ($i = 1; $i -le $count; $i++) {
                $fields += [string]$r.GetType().InvokeMember('StringData', 'GetProperty', $null, $r, @($i))
              }
              $rows += ,$fields
            }
            $rows
          }

          # The counterpart to the RPM job's version check, and the more necessary of the two.
          # ProductVersion has to be numeric, so a SemVer prerelease label is dropped on the way in
          # and a version derived from the wrong place arrives here looking entirely ordinary --
          # v1.2.0 shipped an MSI reading 1.2.1.0, which nothing about the file gave away.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $expected = $env:GITHUB_REF_NAME -replace '^v', ''
            # Filtered here rather than in the query. A single-row result comes back from Get-Rows
            # unwrapped -- PowerShell flattens the outer array -- so [0] is the first field rather
            # than the first row, and indexing it again walks into the string a character at a
            # time. Selecting the whole table keeps it a list of rows, which is why the checks
            # below have never had to think about it.
            $actual = Get-Rows 'SELECT Property, Value FROM Property' |
              Where-Object { $_[0] -eq 'ProductVersion' } | ForEach-Object { $_[1] }
            Write-Output "product version: $actual"
            # Authored as three parts and padded to four by the installer, so compare the prefix.
            if ($actual -ne $expected -and $actual -ne "$expected.0") {
              Write-Output "::error::building $env:GITHUB_REF_NAME produced version $actual, expected $expected"
              exit 1
            }
          }

          $environment = Get-Rows 'SELECT Name, Value FROM Registry' |
            Where-Object { $_[0] -eq 'Environment' } | ForEach-Object { $_[1] }
          $environment | ForEach-Object { Write-Output "service environment: $_" }

          if (-not ($environment -match 'ASPNETCORE_HTTP_PORTS=5000')) {
            Write-Output '::error::the MSI no longer sets the port on the service, so it would bind localhost only'
            exit 1
          }

          # Port and protocol as numbers: 6 is TCP. Profile 1 is domain and 2 is private; the public
          # profile is deliberately not among them, and finding it here means someone widened the
          # rule to networks the unauthenticated UI has no business answering on.
          #
          # The table name carries the extension's major version, so moving off WiX 6 renames it and
          # fails this step until the name is updated — which is the point at which to check that
          # the rule still means what it did.
          $rules = Get-Rows 'SELECT Name, Port, Protocol, Profile FROM Wix5FirewallException'
          $rules | ForEach-Object { Write-Output "firewall rule: $($_ -join ' ')" }

          $profiles = $rules | Where-Object { $_[1] -eq '5000' -and $_[2] -eq '6' } | ForEach-Object { $_[3] }
          if (($profiles | Sort-Object) -join ',' -ne '1,2') {
            Write-Output '::error::the MSI no longer opens TCP 5000 in exactly the domain and private profiles'
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: msi
          path: HostPinger.WindowsInstaller/bin/**/*.msi
          if-no-files-found: error

  release:
    name: release
    # The gate sits here rather than between the build jobs. Those four catch disjoint failures —
    # and since the test project references only HostPinger.Core, the packaging jobs are the sole
    # compile check for the web project — so making them wait on one another would delay signal
    # without changing whether the run is red. What actually warrants a gate is publishing, and
    # this job cannot start unless all four passed.
    needs: [test, rpm, deb, msi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # gh release create writes to the repository.
      contents: write
    steps:
      # No name filter: this collects every artifact the run produced into one directory per job.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Signing lives here rather than in the rpm job or build-rpm.sh: this job runs only on a
      # tag, so the key is exposed once per release and never to a push or pull request build —
      # and the developer script stays runnable on a machine with no key material, producing the
      # unsigned local build that is correct for anything unpublished. rpmsign rewrites the files
      # in place, so what the publish step below attaches is the signed set. The public half of
      # the key is HostPinger.LinuxInstaller/hostpinger.asc.
      #
      # RPMs only, and the deb is not an oversight: apt does not verify a signature on a package
      # it is handed, it verifies the repository's signed InRelease. The deb's signature is
      # therefore applied where that index is built, in the repo job, over the same key.
      - name: Sign the RPMs
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm

          gpg --batch --import <<< "$PKG_SIGNING_KEY"
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "sec" { print $5; exit }')

          # Collected before signing so that an empty match is a failure. A find that feeds
          # rpmsign directly would sign nothing and succeed, and unsigned packages surface as a
          # refusal on a user's machine, not anywhere in this workflow.
          mapfile -t rpms < <(find artifacts -type f -name '*.rpm')
          if [ "${#rpms[@]}" -eq 0 ]; then
            echo "::error::no RPMs arrived to be signed"
            exit 1
          fi

          # __gpg is spelled out because Ubuntu's rpm points the macro at /usr/bin/gpg2, a path
          # nothing installed here provides — the gnupg package ships /usr/bin/gpg only.
          rpmsign --define "_gpg_name $keyid" --define "__gpg /usr/bin/gpg" --addsign "${rpms[@]}"

          # Re-verified against a scratch rpmdb holding only the public key — the same check dnf
          # makes at install. rpmsign exiting zero is not that check, and this is the last point
          # where a bad signature is a red run rather than a shipped package.
          gpg --armor --export "$keyid" > pubkey.asc
          rpmkeys --dbpath "$PWD/scratch-rpmdb" --import pubkey.asc
          checked=$(rpmkeys --dbpath "$PWD/scratch-rpmdb" --checksig "${rpms[@]}")
          echo "$checked"
          if grep -v ': digests signatures OK$' <<< "$checked"; then
            echo "::error::a package failed signature verification after signing"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # GitVersion marks anything with a prerelease suffix, and a tag like v1.2.0-rc1 should
          # not become the release users are offered by default.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac

          # Found rather than globbed: upload-artifact decides how deeply it nests each artifact
          # based on the common prefix of what matched, which differs between the jobs.
          mapfile -t files < <(find artifacts -type f \( -name '*.rpm' -o -name '*.deb' -o -name '*.msi' \))
          printf 'attaching: %s\n' "${files[@]}"

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            "${files[@]}"

  repo:
    name: repo (pages)
    # A release attached to a tag is a file to be found and downloaded; dnf and apt need an index
    # they can poll. This publishes one of each to Pages so an installed machine can upgrade with
    # its own package manager rather than by being handed a URL each time.
    #
    # Publishing follows a release and nothing else. The content comes from the releases that
    # exist rather than from the run that produced one, so republishing on a push to main or by
    # hand looked free — but the github-pages environment only accepts a deployment from a tag, so
    # those runs could never do anything except fail on the way out. Gating on release alone is
    # enough: release runs only on a tag, and a push, a pull request or a manual run skips it and
    # skips this with it. To repair the metadata by hand, re-run this job on the run of the tag
    # that last released.
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The checkout exists for exactly one file: the signing public key, served beside the
      # packages so the gpgkey= line below has something to point at, embedded in the apt sources
      # file, and used to verify this job's own signature. Shallow is fine — nothing in this job
      # computes a version.
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6
        id: pages
        with:
          # Kept for the case where Pages is turned off again later, not because it can bootstrap
          # this repository: GITHUB_TOKEN is refused when it tries to create the site, so Pages has
          # to be switched to the Actions source in Settings once, by hand, before any of this
          # runs. The job fails on this step until that is done.
          enablement: true

      - name: Install the indexing tools
        run: |
          sudo apt-get update
          # apt-utils is what carries apt-ftparchive, which builds the Debian index.
          sudo apt-get install -y createrepo-c apt-utils

      - name: Collect every published package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # pool/main/h/hostpinger is where apt looks for the files the index points at; the
          # single-letter level is the conventional fan-out and dpkg tooling assumes it.
          mkdir -p site/fedora/x86_64 site/debian/pool/main/h/hostpinger

          # Every release, not only the one this run produced. A Pages deployment replaces the
          # whole site, so anything not gathered here disappears from the index — and a package
          # that vanishes takes the downgrade path and any pinned install with it.
          #
          # Releases carrying neither kind of package are expected rather than exceptional: the
          # tags predating each packaging workflow have none, so a missing pattern is not a
          # failure. Every tag through v1.11.0 carries RPMs and no deb.
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir site/fedora/x86_64 \
              --pattern '*.rpm' --skip-existing || echo "no rpm attached to $tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --dir site/debian/pool/main/h/hostpinger \
              --pattern '*.deb' --skip-existing || echo "no deb attached to $tag"
          done

          if ! ls site/fedora/x86_64/*.rpm >/dev/null 2>&1; then
            echo "::error::no RPMs found across any release; refusing to publish an empty repository"
            exit 1
          fi
          ls -l site/fedora/x86_64 site/debian/pool/main/h/hostpinger

      - name: Build the dnf repository metadata
        run: createrepo_c site/fedora/x86_64

      # Separate from the dnf index because the two are not symmetrical: apt verifies the index
      # rather than the packages, so this half is only trustworthy once the step below signs it.
      # Skipped rather than fatal when no deb was found — the tags before v1.12.0 have none, and
      # re-running this job on one of them to repair Pages has to stay possible.
      - name: Build the apt repository metadata
        run: |
          set -euo pipefail
          if ! ls site/debian/pool/main/h/hostpinger/*.deb >/dev/null 2>&1; then
            echo "::notice::no debs found across any release; skipping the apt repository"
            exit 0
          fi

          mkdir -p site/debian/dists/trixie/main/binary-amd64

          # Run from site/debian so that the Filename: fields come out relative to the repository
          # root, which is what apt resolves them against.
          cd site/debian
          apt-ftparchive packages pool > dists/trixie/main/binary-amd64/Packages
          gzip -9nk dists/trixie/main/binary-amd64/Packages

          # Release lists the checksums of the files above, so it is generated after them and
          # never includes itself.
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=HostPinger \
            -o APT::FTPArchive::Release::Label=HostPinger \
            -o APT::FTPArchive::Release::Suite=trixie \
            -o APT::FTPArchive::Release::Codename=trixie \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Description="HostPinger for Debian 13" \
            release dists/trixie > dists/trixie/Release

          cat dists/trixie/Release

      # The apt counterpart to the release job's rpmsign. It has to happen here because the thing
      # apt checks is this index: a deb carries no signature of its own, so an unsigned InRelease
      # is an unverifiable repository however the packages inside it were built.
      - name: Sign the apt repository index
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ ! -f site/debian/dists/trixie/Release ]; then
            echo "::notice::no apt repository was built; nothing to sign"
            exit 0
          fi

          gpg --batch --import <<< "$PKG_SIGNING_KEY"
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "sec" { print $5; exit }')

          # Both spellings: InRelease is the signed-in-place file every current apt prefers, and
          # Release.gpg beside it is the detached form older clients still ask for first.
          gpg --batch --yes --local-user "$keyid" \
            --clearsign -o site/debian/dists/trixie/InRelease site/debian/dists/trixie/Release
          gpg --batch --yes --local-user "$keyid" \
            --detach-sign --armor -o site/debian/dists/trixie/Release.gpg site/debian/dists/trixie/Release

          # Verified against the committed public key rather than the one just imported, which
          # would only prove gpg agrees with itself. This is the check that the secret still
          # matches the key users are told to trust — the two halves are stored in different
          # places and nothing else would notice them drifting apart.
          gpg --dearmor < HostPinger.LinuxInstaller/hostpinger.asc > verify.gpg
          gpgv --keyring "$PWD/verify.gpg" site/debian/dists/trixie/InRelease
          gpgv --keyring "$PWD/verify.gpg" site/debian/dists/trixie/Release.gpg \
                                           site/debian/dists/trixie/Release

      - name: Write the repo files and a landing page
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail

          # Everything published here is signed with the key whose public half is the committed
          # hostpinger.asc, served beside the packages and embedded in the apt sources file. What
          # each package manager checks with it differs. dnf verifies the packages: the release
          # job signs new RPMs at the publishing gate, and the ones on releases predating it were
          # re-signed in place on 2026-09-05. apt has no such thing to verify — a deb carries no
          # signature — so it verifies the index this job signs above.
          #
          # repo_gpgcheck stays off for dnf even though the private key is now demonstrably
          # reachable from this job. It buys nothing here: gpgcheck=1 already covers every
          # package end to end, which is what the metadata would otherwise be vouching for, and
          # the transfer itself is Pages HTTPS. On the apt side the same signature is not
          # optional, because there it is the only verification that exists.
          cp HostPinger.LinuxInstaller/hostpinger.asc site/

          cat > site/hostpinger.repo <<EOF
          [hostpinger]
          name=HostPinger
          baseurl=$BASE/fedora/x86_64/
          enabled=1
          gpgcheck=1
          repo_gpgcheck=0
          gpgkey=$BASE/hostpinger.asc
          metadata_expire=1h
          EOF

          # Written only when there is an apt repository to point at, and the landing page's
          # Debian half is held back with it: a sources file advertising an index that is not
          # there would be worse than saying nothing.
          apt_section=""
          if [ -f site/debian/dists/trixie/InRelease ]; then
            # deb822 rather than a one-line sources.list entry, because it can carry the key
            # inline: the file below is the whole setup, with no separate keyring to install and
            # nothing left in apt's global trust store afterwards. Continuation lines are indented
            # one space and the armor's blank line becomes " .", which is how the format spells an
            # empty line inside a field.
            {
              echo "Types: deb"
              echo "URIs: $BASE/debian"
              echo "Suites: trixie"
              echo "Components: main"
              echo "Architectures: amd64"
              echo "Signed-By:"
              sed -e 's/^/ /' -e 's/^ $/ ./' HostPinger.LinuxInstaller/hostpinger.asc
            } > site/hostpinger.sources

            apt_section=$(cat <<EOF
          <h2>Debian 13</h2>
          <p>Debian ships no .NET of its own, so Microsoft's repository is added first: it is
             where the <code>aspnetcore-runtime-10.0</code> this package depends on comes from.</p>
          <pre>curl -fsSLO https://packages.microsoft.com/config/debian/13/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb

          sudo curl -fsSL -o /etc/apt/sources.list.d/hostpinger.sources $BASE/hostpinger.sources
          sudo apt update
          sudo apt install hostpinger</pre>
          <p>Installing enables and starts the service, as a Debian package is expected to, so
             there is no <code>systemctl enable</code> step to follow. Upgrade with
             <code>sudo apt upgrade hostpinger</code>.</p>
          EOF
            )
          fi

          cat > site/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>HostPinger package repository</title>
          <style>
            body { font-family: system-ui, sans-serif; max-width: 46rem; margin: 3rem auto;
                   padding: 0 1rem; line-height: 1.5; }
            pre { background: #f4f4f4; padding: .75rem 1rem; overflow-x: auto; border-radius: 4px; }
            @media (prefers-color-scheme: dark) {
              body { background: #121212; color: #e0e0e0; }
              pre { background: #1e1e1e; }
              a { color: #7db3ff; }
            }
          </style>
          <h1>HostPinger package repository</h1>
          <p>Package repositories for <a href="https://github.com/$GITHUB_REPOSITORY">HostPinger</a>,
             64-bit x86, framework-dependent against ASP.NET Core 10 — the runtime comes from the
             distribution's own packaging and is patched with it.</p>
          <h2>Fedora</h2>
          <pre>sudo dnf config-manager addrepo --from-repofile=$BASE/hostpinger.repo
          sudo dnf install hostpinger
          sudo systemctl enable --now hostpinger</pre>
          <p>On dnf4 the first line is
             <code>sudo dnf config-manager --add-repo $BASE/hostpinger.repo</code>. Upgrade with
             <code>sudo dnf upgrade hostpinger</code>.</p>
          $apt_section
          <h2>Signing</h2>
          <p>Everything published here is signed with one key, whose fingerprint is</p>
          <pre>D416 D7AA C202 68A1 398D  5DC5 A573 4F40 6392 00AE</pre>
          <p>The two package managers verify different things with it. dnf verifies the packages
             themselves: the repository sets <code>gpgcheck=1</code> and the key is served at
             <a href="$BASE/hostpinger.asc">hostpinger.asc</a>, which is what dnf shows the
             fingerprint of when it asks to import it. A deb carries no signature of its own, so
             apt verifies the repository index instead — signed as <code>InRelease</code>, against
             the copy of the key carried inside the sources file, which is why nothing needs
             importing there.</p>
          <p>A machine that added the Fedora repository while it was unsigned still has the old
             repo file with <code>gpgcheck=0</code>; dnf never refreshes those, so re-run the add
             step above to pick up verification.</p>
          EOF

          cat site/hostpinger.repo
          if [ -f site/hostpinger.sources ]; then
            # Without the key block, which is most of the file and none of the interesting part.
            sed -n '/^Signed-By:/q;p' site/hostpinger.sources
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deploy
