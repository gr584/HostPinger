version: 2

updates:
  # The actions pinned in build.yml, which name a commit rather than a tag. A SHA never moves,
  # so nothing else here would ever update them -- not a patch, not a security fix, not a major,
  # where a floating tag at least drifted onto fixes on its own. Dependabot rewrites the SHA and
  # the version comment beside it, which is why those are written as a bare "# v7": it updates a
  # version only where it ends the comment, taking anything after it for prose rather than a tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Seven actions moving in step; one PR rather than seven.
      actions:
        patterns: ['*']

  # Every version lives in Directory.Packages.props, but Dependabot only bumps a package there
  # when it finds a project referencing it, so the project directories are listed explicitly:
  # HostPinger.slnx is not a solution format Dependabot reads, which is why leaving it to find
  # the projects from the root would turn up almost nothing. The benchmarks are listed too: they
  # ship nowhere, but they are the only project referencing BenchmarkDotNet, which would otherwise
  # never be bumped.
  #
  # The vendored Bootstrap under HostPinger/wwwroot/lib is bumped by hand: it is checked in rather
  # than restored.
  - package-ecosystem: nuget
    directories:
      - /
      - /HostPinger
      - /HostPinger.Core
      - /HostPinger.Test
      - /HostPinger.UITest
      - /HostPinger.Benchmarks
    schedule:
      interval: weekly
    # HostPinger stays on .NET's long-term-support releases. A major of these packages is the
    # next runtime's band, so taking one means moving the target framework, the runtime the deb
    # and rpm depend on, and production's runtime with it; on its own it either fails restore or
    # mixes an 11.0 library into a 10.0 app (#42, #43). Majors are taken by hand, all together,
    # when the project moves to the next LTS.
    ignore:
      - dependency-name: Microsoft.EntityFrameworkCore.*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.Extensions.*
        update-types: [version-update:semver-major]
    groups:
      # The EF Core and Microsoft.Extensions packages are serviced as one band alongside the
      # runtime they target, so a servicing release would otherwise arrive as half a dozen
      # separate PRs that all have to be merged together anyway.
      dotnet:
        patterns:
          - Microsoft.EntityFrameworkCore.*
          - Microsoft.Extensions.*
        update-types: [minor, patch]
